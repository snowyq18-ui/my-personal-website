<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b16">
    <title>My Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #070b16;
            --card-background: rgba(12, 19, 36, 0.78);
            --text-color: #eceff5;
            --muted-color: #96b3ea;
            --anime-color: #d8dee9;
            --anime-glow: rgba(89, 97, 116, 0.767);
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 20px;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text-color);
            background: var(--background);
            position: relative;
            isolation: isolate;
            overflow-x: hidden;
        }

        /* VIDEO BACKGROUND */
        .background-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 0;
            pointer-events: none;
        }

        /* DARK OVERLAY */
        .background-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: rgba(3, 7, 18, 0.52);
            pointer-events: none;
        }

        /* FALLING SNOW */
        #snow {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* PROFILE CARD */
        .card {
            position: relative;
            z-index: 2;
            isolation: isolate;
            width: 100%;
            max-width: 360px;
            padding: 32px 25px;
            text-align: center;
            background: var(--card-background);
            border: 2px solid var(--anime-color);
            border-radius: 22px;
            box-shadow:
                0 0 12px var(--anime-glow),
                0 0 30px var(--anime-glow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: appear 1s ease forwards;
        }

        /* AVATAR */
        .avatar {
            display: block;
            width: 105px;
            height: 105px;
            margin: 0 auto 16px;
            border-radius: 50%;
            border: 2px solid var(--anime-color);
            object-fit: cover;
            box-shadow: 0 0 18px var(--anime-glow);
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.06);
        }

        /* NAME */
        .name {
            font-size: 27px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 8px;
            overflow-wrap: anywhere;
            text-shadow: 0 0 12px var(--anime-glow);
        }

        /* STATUS */
        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 16px;
            padding: 6px 11px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: var(--muted-color);
            font-size: 12px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            flex-shrink: 0;
            border-radius: 50%;
            background: #8affb0;
            box-shadow: 0 0 8px #8affb0;
        }

        /* BIO */
        .bio {
            color: var(--muted-color);
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 23px;
            overflow-wrap: anywhere;
        }

        /* SOCIAL ICONS */
        .socials {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 13px;
        }

        .social {
            width: 43px;
            height: 43px;
            display: flex;
            flex-shrink: 0;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            text-decoration: none;
            transition: 0.25s ease;
        }

        .social svg {
            width: 19px;
            height: 19px;
            fill: currentColor;
        }

        .social:hover,
        .social:focus-visible {
            color: var(--anime-color);
            border-color: var(--anime-color);
            background: rgba(255, 255, 255, 0.09);
            box-shadow: 0 0 15px var(--anime-glow);
            transform: translateY(-4px);
            outline: none;
        }

        /* FOOTER */
        .footer {
            margin-top: 24px;
            color: var(--muted-color);
            font-size: 11px;
            letter-spacing: 1px;
        }

        /* MUSIC BUTTON */
        .music-toggle {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 20;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 11px 15px;
            border: 1px solid var(--anime-color);
            border-radius: 999px;
            background: rgba(7, 11, 22, 0.9);
            color: var(--text-color);
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 0 14px var(--anime-glow);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.2s ease;
        }

        .music-toggle:hover {
            transform: translateY(-2px);
        }

        .music-toggle:focus-visible {
            outline: 2px solid white;
            outline-offset: 3px;
        }

        .music-icon {
            font-size: 18px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 420px) {
            .card {
                max-width: 330px;
                padding: 28px 20px;
            }

            .name {
                font-size: 24px;
            }

            .music-toggle {
                right: 12px;
                bottom: 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card {
                animation: none;
            }

            .social,
            .avatar,
            .music-toggle {
                transition: none;
            }

            .social:hover,
            .music-toggle:hover {
                transform: none;
            }
        }
    </style>
</head>

    <script>
        /* ==================================
           FALLING SNOW
        ================================== */

        const canvas = document.getElementById("snow");
        const ctx = canvas.getContext("2d");

        let flakes = [];
        let width = 0;
        let height = 0;
        let animationId;

        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);

            width = window.innerWidth;
            height = window.innerHeight;

            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);

            canvas.style.width = width + "px";
            canvas.style.height = height + "px";

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const count = Math.min(
                130,
                Math.max(35, Math.floor((width * height) / 8500))
            );

            flakes = Array.from({ length: count }, () => ({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.8 + 0.3,
                drift: Math.random() * 0.6 - 0.3,
                opacity: Math.random() * 0.6 + 0.2
            }));
        }

        function animateSnow() {
            ctx.clearRect(0, 0, width, height);

            for (const flake of flakes) {
                ctx.beginPath();
                ctx.arc(
                    flake.x,
                    flake.y,
                    flake.radius,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    `rgba(230, 240, 255, ${flake.opacity})`;
                ctx.fill();

                flake.y += flake.speed;
                flake.x += flake.drift;

                if (flake.y > height + 5) {
                    flake.y = -5;
                    flake.x = Math.random() * width;
                }

                if (flake.x > width + 5) {
                    flake.x = -5;
                } else if (flake.x < -5) {
                    flake.x = width + 5;
                }
            }

            animationId = requestAnimationFrame(animateSnow);
        }

        window.addEventListener("resize", resizeCanvas);

        resizeCanvas();
        animateSnow();

        /* Pause snow when the page is hidden */
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                cancelAnimationFrame(animationId);
            } else {
                cancelAnimationFrame(animationId);
                animateSnow();
            }
        });

        /* ==================================
           MUSIC PLAY / PAUSE
    ================================== */

    const music = document.getElementById("backgroundMusic");
    const musicToggle = document.getElementById("musicToggle");
    const musicLabel = document.getElementById("musicLabel");
    const musicIcon = document.getElementById("musicIcon");

    function updateMusicButton() {
        if (music.paused || music.ended) {
            musicIcon.textContent = "▶";
            musicLabel.textContent = "Play Music";
            musicToggle.setAttribute("aria-pressed", "false");
        } else {
            musicIcon.textContent = "⏸";
            musicLabel.textContent = "Pause Music";
            musicToggle.setAttribute("aria-pressed", "true");
        }
    }

    /* Set music volume */
    music.volume = 0.5;

    /* Try to autoplay when the website opens */
    music.play()
        .then(() => {
            updateMusicButton();
        })
        .catch(() => {
            updateMusicButton();
            console.log("Autoplay was blocked by the browser.");
        });

    /* Play or pause when the button is clicked */
    musicToggle.addEventListener("click", async () => {
        if (music.paused || music.ended) {
            musicLabel.textContent = "Loading...";

            try {
                await music.play();
                updateMusicButton();
            } catch (error) {
                updateMusicButton();
                console.error("Music could not play. Check your MP3 file and its path.", error);
            }
        } else {
            music.pause();
            updateMusicButton();
        }
    });

    /* Update icons whenever playback changes */
    music.addEventListener("play", updateMusicButton);
    music.addEventListener("pause", updateMusicButton);
    music.addEventListener("ended", updateMusicButton);

    /* Handle music loading errors */
    music.addEventListener("error", () => {
        musicLabel.textContent = "Music unavailable";
        musicIcon.textContent = "▶";
        musicToggle.setAttribute("aria-pressed", "false");

        console.error("Could not load the music file.");
    });

    music.addEventListener("ended", updateMusicButton);
</script>
